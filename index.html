<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Central TFD Municipal - Gestão de Tratamento Fora do Domicílio</title>
    <meta name="description" content="Sistema de Gestão da Central de Tratamento Fora do Domicílio (TFD) para Prefeituras Municipais - Triagem, Frotas, Embarque 58mm e Diárias." />
    <meta property="og:title" content="Central TFD Municipal - Gestão de Tratamento Fora do Domicílio" />
    <meta property="og:description" content="Sistema de Gestão da Central de Tratamento Fora do Domicílio (TFD) para Prefeituras Municipais - Triagem, Frotas, Embarque 58mm e Diárias." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    
    <!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Bootstrap 5 CSS via CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <style>
      body {
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        -webkit-font-smoothing: antialiased;
        background-color: #f8fafc;
      }
      .font-mono, .tabular-nums {
        font-family: 'JetBrains Mono', monospace;
        font-variant-numeric: tabular-nums;
      }

      /* Print styles specifically for 58mm Thermal Printer (POS-58) and A4 Receipts */
      @media print {
        body * {
          visibility: hidden;
        }
        #thermal-voucher-print-area, #thermal-voucher-print-area * {
          visibility: visible;
        }
        #thermal-voucher-print-area {
          position: absolute;
          left: 0;
          top: 0;
          width: 58mm !important;
          max-width: 58mm !important;
          padding: 2mm 3mm !important;
          margin: 0 !important;
          background: #ffffff !important;
          color: #000000 !important;
          font-family: 'JetBrains Mono', monospace, monospace !important;
          font-size: 11px !important;
          line-height: 1.25 !important;
        }

        #receipt-print-area, #receipt-print-area * {
          visibility: visible;
        }
        #receipt-print-area {
          position: absolute;
          left: 0;
          top: 0;
          width: 100% !important;
          margin: 0 !important;
          padding: 20mm !important;
          background: #ffffff !important;
          color: #000000 !important;
        }
        @page {
          margin: 0;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
